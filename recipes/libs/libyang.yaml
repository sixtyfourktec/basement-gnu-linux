inherit: [cmake]

metaEnvironment:
    PKG_VERSION: "3.13.6"
    PKG_LICENSE: "BSD-3-Clause"

depends:
    - libs::pcre2-dev
    - use: []
      depends:
          - libs::pcre2-tgt

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/CESNET/libyang/archive/refs/tags/v${PKG_VERSION}.tar.gz
    digestSHA256: 5cd5018f39c830f97d70616c003990287ce5e820ae2792763a49e2a1f63af8d6
    stripComponents: 1

buildScript: |
    cmakeBuild $1 \
        -DENABLE_TESTS=OFF \
        -DENABLE_VALGRIND_TESTS=OFF

multiPackage:
    "":
        depends:
            - name: libs::libyang-tgt
              use: []
        packageScript: cmakePackageBin
        provideDeps: [ "*-tgt" ]

    dev:
        packageScript: cmakePackageDev
        provideDeps: [ "*-dev" ]

    tgt:
        packageScript: cmakePackageLib
        provideDeps: [ "*-tgt" ]
